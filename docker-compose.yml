services:
  postgres:
    image: postgres:17
    container_name: postoffice-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: postoffice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postoffice_pgdata:/var/lib/postgresql/data

volumes:
  postoffice_pgdata:
